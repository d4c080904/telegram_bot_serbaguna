services:
  bot:
    build: .
    container_name: bot-serbaguna
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./bot_history.db:/app/bot_history.db
      - ./bot.log:/app/bot.log
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"