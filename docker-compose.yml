version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gymmate_db
    environment:
      POSTGRES_USER: gymmate
      POSTGRES_PASSWORD: rahasia_gymmate
      POSTGRES_DB: gymmate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # --- INI KUNCINYA: Kasih tau Docker cara ngecek DB udah siap apa belum ---
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymmate -d gymmate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # INI SERVICE BOT NYA BRO, JANGAN SAMPE KELUPAAN
  # ==========================================
  bot:
    build: .
    container_name: gymmate_bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy # <--- Bot bakal nunggu DB sehat dulu baru nyala
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://gymmate:rahasia_gymmate@db:5432/gymmate_db

volumes:
  postgres_data: