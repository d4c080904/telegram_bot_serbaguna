version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: gymmate_db
    environment:
      POSTGRES_USER: gymmate
      POSTGRES_PASSWORD: rahasia_gymmate
      POSTGRES_DB: gymmate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: